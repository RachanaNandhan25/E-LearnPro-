<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | E-Learn Pro</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap");

      * {
        font-family: "Kanit", sans-serif;
      }

      body {
        margin: 0;
        padding: 0;
        font-size: 1rem;
        background: url("Bg.jpg") no-repeat center center fixed;
        background-size: cover;
        backdrop-filter: brightness(0.7);
        overflow: hidden;
      }

      header {
        text-align: center;
        font-size: 2.2rem;
        display: flex;
        justify-content: left;
        padding: 1rem 5%;
        font-weight: bold;
        background: linear-gradient(to left, #0b1a2d, rgba(255, 255, 255, 0.7));
        color: #0b1a2d;
      }

      .auth-card {
        margin-top: -80px;
        background-color: #cbd0d4;
        padding: 35px 40px;
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
        font-size: 1rem;
      }

      .form-label {
        font-weight: 600;
        font-size: 1rem;
      }

      input.form-control,
      select.form-control {
        border-radius: 8px;
        font-size: 1rem;
      }

      .btn-primary-custom {
        background-color: #0a192f;
        color: white;
        font-weight: 500;
        border: none;
        border-radius: 8px;
        padding: 8px 22px;
      }

      .btn-primary-custom:hover {
        color: lightgray;
        background-color: #102f52;
      }

      .btn-danger {
        font-size: 0.9rem;
      }

      @media (max-width: 768px) {
        .col-md-4,
        .col-md-6 {
          margin-bottom: 10px;
        }
      }
    </style>
  </head>
  <body>
    <header>E - LEARN PRO</header>

    <div
      class="container d-flex justify-content-center align-items-center"
      style="min-height: 100vh"
    >
      <div class="col-lg-10">
        <div class="auth-card">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0" style="font-weight: bold">STUDENT REGISTRATION</h2>
            <button
              onclick="window.location.href='index.html'"
              class="btn btn-danger btn-m"
              style="width: 80px"
            >
              EXIT
            </button>
          </div>

          <p class="text-danger mb-4">* All fields are mandatory</p>

          <form id="registrationForm">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" required />
              </div>
              <div class="col-md-4">
                <label class="form-label">Date of Birth</label>
                <input type="date" class="form-control" id="dob" required />
              </div>
              <div class="col-md-4">
                <label class="form-label">Gender</label>
                <select class="form-control" id="gender" required>
                  <option value="" disabled selected>Select Gender</option>
                  <option>Male</option>
                  <option>Female</option>
                  <option>Other</option>
                  <option>Prefer not to say</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label">Institute Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="institute"
                  required
                />
              </div>
              <div class="col-md-4">
                <label class="form-label">Education Level</label>
                <select class="form-control" id="education" required>
                  <option value="">Select</option>
                  <option>High School</option>
                  <option>Under Graduation</option>
                  <option>Post Graduation</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Field of Study</label>
                <select class="form-control" id="field" required>
                  <option value="">Select Field</option>
                  <option>Computer Science</option>
                  <option>Information Technology</option>
                  <option>Electronics and Communication</option>
                  <option>Electrical Engineering</option>
                  <option>Mechanical Engineering</option>
                  <option>Civil Engineering</option>
                  <option>Biotechnology</option>
                  <option>Artificial Intelligence</option>
                  <option>Data Science</option>
                  <option>Business Administration</option>
                  <option>Commerce</option>
                  <option>Accounting</option>
                  <option>Physics</option>
                  <option>Chemistry</option>
                  <option>Mathematics</option>
                  <option>Psychology</option>
                  <option>Economics</option>
                  <option>Others</option>
                </select>
              </div>

              <!-- Separate row for course -->
              <div class="col-md-12">
                <label class="form-label">Select Course</label>
                <select class="form-control" id="course" required>
                  <option value="">Select Course</option>
                  <option>Web Development</option>
                  <option>Data Structures & Algorithms</option>
                  <option>Machine Learning</option>
                  <option>Cloud Computing</option>
                  <option>Cyber Security</option>
                </select>
              </div>

              <!-- Country, State, City in the same row -->
              <div class="col-md-4">
                <label class="form-label">Country</label>
                <input type="text" class="form-control" id="country" required />
              </div>
              <div class="col-md-4">
                <label class="form-label">State</label>
                <input type="text" class="form-control" id="state" required />
              </div>
              <div class="col-md-4">
                <label class="form-label">City</label>
                <input type="text" class="form-control" id="city" required />
              </div>
            </div>

            <div class="d-flex justify-content-between mt-4">
              <button
                type="button"
                class="btn btn-secondary"
                onclick="window.location.href='index.html'"
              >
                BACK
              </button>
              <button type="submit" class="btn btn-primary-custom">
                REGISTER
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      document
        .getElementById("registrationForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const fields = [
            "name",
            "dob",
            "gender",
            "institute",
            "education",
            "field",
            "course",
            "country",
            "state",
            "city",
          ];

          let allFilled = fields.every(
            (id) => document.getElementById(id).value.trim() !== ""
          );

          if (!allFilled) {
            alert("❗ Please fill all required fields.");
            return;
          }

          alert("✅ Student registered successfully.");
          this.reset();
        });
    </script>
  </body>
</html>
